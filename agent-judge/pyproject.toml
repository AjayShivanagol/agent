[project]
name = "agent_judge"
version = "0.1.0"
description = "Agent Judge - Evaluates agent responses for accuracy and quality"
readme = "README.md"
requires-python = ">=3.11"
packages = ["agent_judge"]
dependencies = [
    "a2a-sdk>=0.2.6,<0.3.0",
    "click>=8.1.8",
    "httpx>=0.28.1",
    "langchain-google-genai>=2.0.10",
    "langgraph>=0.3.18",
    "langchain-openai >=0.1.0",
    "openai>=1.0.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.34.2",
    "fastapi>=0.115.12",
    "requests>=2.32.0",
    "python-multipart>=0.0.20",
    "pytest>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_judge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"